<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼼지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 놀이판: 위에 그림 고르기, 왼쪽(세로 화면은 위)에 맞추는 판, 오른쪽(아래)에 조각 놓는 곳 */
:root {
  /* 꼼지 브랜드: 써니 옐로 #F7C948, 소프트 코랄 #FF8B7B, 스카이 블루 #8EC3F4, 차콜 #4A4A4A */
  --bg: #FFF8E7;
  --panel: #FFFFFF;
  --tray: #FFF3D4;
  --ink: #3F3F3F;
  --soft: #7B7468;
  --line: #EBDDB9;
  --slot: #EAE1CB;
  --accent: #F7C948;
  --on-accent: #3A3A3A;
  --pop: #EE6A5A;
  --limb: #4A4A4A;
  --bar: #3F3F3F;
  --on-bar: #FFF8E7;
  --shadow: rgba(74, 60, 20, .24);
  /* 아래 색은 밝은 화면과 어두운 화면에서 같게 쓴다 */
  --on-fill: #3A3A3A;
  --on-tile: #3F3F3F;
  --paper: #FFFDF6;
  --silver: #D9D9D6;
  --t-yellow: #FBD968; --t-blue: #B7D9F8; --t-coral: #FFB3A7; --t-sage: #BEDDCB;
  --p0: #FF8B7B; --p1: #8EC3F4; --p2: #86C6A6; --p3: #F7C948;
  --p4: #FFAA5C; --p5: #B79DEA; --p6: #6FCBCB;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1D1B; --panel: #2E2C29; --tray: #262422; --ink: #F8F2E2; --soft: #B8B0A0;
    --line: #4B4741; --slot: #47433D; --pop: #FF8B7B; --limb: #8F887B; --bar: #121110;
    --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1D1B; --panel: #2E2C29; --tray: #262422; --ink: #F8F2E2; --soft: #B8B0A0;
  --line: #4B4741; --slot: #47433D; --pop: #FF8B7B; --limb: #8F887B; --bar: #121110;
  --shadow: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
/* 빠르게 두 번 누를 때 화면이 확대되지 않게 한다 (아이폰의 두 번 눌러 확대 끄기). 두 손가락 확대는 그대로 된다. */
html, body, button { touch-action: manipulation; }
/* 처음에는 화면에 딱 맞게. 가로로 넘치지 않게 막아 두고, 두 손가락으로는 늘리고 줄일 수 있다. */
html { overflow: hidden; }
body { width: 100%; max-width: 100%; }
.view, .bar, .group, .stage { min-width: 0; max-width: 100%; }
body {
  display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 18px;
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.bar h1 { margin: 0 8px 0 0; font-size: 1.9rem; font-weight: 400; line-height: 1; }
.group { display: flex; flex-wrap: wrap; gap: 8px; }
.group.end { margin-left: auto; }
.group { align-items: center; }
.lab { color: var(--soft); font-size: 1.05rem; white-space: nowrap; } /* 엄마가 보는 설정 이름 */
/* 그림 버튼은 한 줄로 두고, 넘치면 옆으로 밀어서 본다 */
#picker { flex-wrap: nowrap; overflow-x: auto; padding-block: 2px; scrollbar-width: thin; }
#picker .chip { flex: none; }

.chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 15px;
  border: 2px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--ink);
  font: inherit; font-size: 1.25rem; line-height: 1; cursor: pointer;
}
.chip svg { width: 26px; height: 26px; fill: currentColor; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.stage { position: relative; flex: 1; min-height: 0; }
#svg { display: block; width: 100%; height: 100%; touch-action: pinch-zoom; }
.board { fill: var(--panel); }
.tray { fill: var(--tray); stroke: var(--line); stroke-width: 3; stroke-dasharray: 10 10; }
.slot { fill: var(--slot); stroke: var(--panel); stroke-width: 3; stroke-dasharray: 9 7; stroke-linejoin: round; }
.plain .slot { stroke: var(--slot); stroke-dasharray: none; }
.piece { cursor: grab; }
.piece polygon { stroke: var(--panel); stroke-width: 3; stroke-linejoin: round; }
.piece.drag { cursor: grabbing; filter: drop-shadow(0 8px 8px var(--shadow)); }
.piece.placed { cursor: default; }
.c0 { fill: var(--p0); } .c1 { fill: var(--p1); } .c2 { fill: var(--p2); } .c3 { fill: var(--p3); }
.c4 { fill: var(--p4); } .c5 { fill: var(--p5); } .c6 { fill: var(--p6); }

#fx, #qfx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.win-card {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 28px 32px; border-radius: 28px;
  background: var(--panel); box-shadow: 0 14px 40px var(--shadow);
  text-align: center;
}
.win-card h2 { margin: 0; font-size: 2.4rem; font-weight: 400; }
.win-card .group { justify-content: center; }
.win-card .chip { min-height: 60px; padding: 0 28px; font-size: 1.5rem; }

.hint { margin: 0; text-align: center; color: var(--soft); font-size: 1.05rem; }

/* ---------- 화면 나누기: 첫 화면 / 칠교 / 문제 놀이 ---------- */
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.chip.big { min-height: 60px; padding: 0 22px; font-size: 1.4rem; }

/* 첫 화면: 꼼지가 인사하고, 색 타일로 놀이를 고른다 */
.hello { display: flex; align-items: center; gap: 14px; }
.hello .mj { width: 92px; height: 92px; flex: none; }
.hello h1 { margin: 0; font-size: 2rem; font-weight: 400; line-height: 1.15; text-wrap: balance; }
.hello p { margin: 4px 0 0; color: var(--soft); font-size: 1.1rem; }
.hello .group { margin-left: auto; flex: none; }
.tiles { flex: 1; min-height: 0; overflow-y: auto; padding-block: 2px; display: flex; flex-direction: column; gap: 18px; }
.area { display: flex; flex-direction: column; gap: 8px; }
.area h2 { margin: 0 4px; color: var(--soft); font-size: 1.15rem; font-weight: 400; letter-spacing: .02em; }
.area .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
/* 잠깐 놀기: 위쪽 줄에 있는 작은 단추. 꼼지가 놀이 하나를 골라 준다. */
.quick {
  display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 14px;
  border: 0; border-radius: 999px; background: var(--bar); color: var(--on-bar);
  font: inherit; cursor: pointer;
}
.quick b { font-weight: 400; font-size: 1.25rem; line-height: 1; white-space: nowrap; }
.quick .ico { width: 24px; height: 24px; flex: none; }
.quick:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
.brandline { margin: 0; text-align: center; color: var(--soft); font-size: .95rem; }

/* 캐릭터: 꼼지(노란 네모), 동글(파란 동그라미), 세모(코랄 세모) */
.mj .body { fill: var(--accent); }
.mj .limb { fill: none; stroke: var(--limb); stroke-width: 9; stroke-linecap: round; }
.mj .tri { fill: var(--p1); }
.mj .spark { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
.mj .cheek { fill: var(--p0); }
.mj .eye, .host .eye { fill: var(--on-tile); }
.mj .feat, .host .feat { fill: none; stroke: var(--on-tile); stroke-linecap: round; stroke-linejoin: round; }
.mj .feat { stroke-width: 4; }
.host { width: 44px; height: 44px; flex: none; }
.host .feat { stroke-width: 2.4; }
.host .round { stroke: var(--p0); stroke-width: 5; stroke-linejoin: round; }
#host-t, #host-q { display: flex; }
.win-mj .mj { display: block; width: 120px; height: 120px; }

.prog span { width: 22px; height: 22px; border: 3px solid var(--line); border-radius: 50%; }
.prog span.on { background: var(--p3); border-color: var(--p3); }

.qwrap {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 16px; border-radius: 24px; background: var(--panel); overflow-y: auto;
}
.qstage { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin-top: auto; }
.qchoices { justify-content: center; gap: 12px; margin-bottom: auto; }
/* 보기는 문제와 떨어뜨리고 점선으로 나눠서, 고르는 곳이 어딘지 바로 보이게 한다 */
.qchoices:not(:empty) { min-width: min(100%, 380px); margin-top: 14px; padding-top: 18px; border-top: 3px dashed var(--line); }
.qsub.en { margin-top: -6px; letter-spacing: .02em; }
.qtext { margin: 0; font-size: 1.7rem; text-align: center; text-wrap: balance; }
.qtext, .bigtime, .fb b, .fb small { word-break: keep-all; } /* 낱말 중간에서 줄이 끊기지 않게 */
.qsub { margin: 0; font-size: 1.2rem; color: var(--soft); }
.bigtime { margin: 0; font-size: 2.6rem; color: var(--pop); }

.choice {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 84px; min-height: 76px; padding: 0 20px;
  border: 3px solid var(--line); border-radius: 22px;
  background: var(--panel); color: var(--ink);
  font: inherit; font-size: 2.1rem; line-height: 1; cursor: pointer;
}
.choice svg { width: 48px; height: 48px; }
.choice.yes { background: var(--p2); border-color: var(--p2); color: var(--on-fill); }
.choice.no { opacity: .35; }
.choice:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.bond { width: min(320px, 70vw); height: auto; }
.bond line { stroke: var(--line); stroke-width: 6; }
.bond .node circle { fill: var(--tray); stroke: var(--line); stroke-width: 4; }
.bond .ask circle { fill: var(--panel); stroke: var(--pop); stroke-dasharray: 8 6; }
.bond text, .clock text { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
.bond text { font-size: 40px; }
.beads { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 330px; }
.bead { width: 26px; height: 26px; border-radius: 50%; }
.bead.b1 { background: var(--p1); }
.bead.b4 { background: var(--p4); }

/* 차곡차곡: 열 개짜리 줄을 위에서부터 쌓고, 낱개는 맨 아랫줄에 놓는다. 구슬은 화면에 맞춰 커진다. */
.count-row {
  --bead: clamp(18px, min(4vh, 7vw), 34px);
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  min-height: calc(var(--bead) * 3);
}
.tens { display: flex; flex-direction: column; gap: 5px; }
.bundle, .ones { display: flex; gap: 3px; padding: 4px 7px; border: 2px solid transparent; border-radius: 999px; }
.bundle { border-color: var(--line); background: var(--tray); }
.bundle i, .ones i {
  display: block; width: var(--bead); height: var(--bead); border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .6) 0 16%, transparent 18%), var(--p0);
}
.ones i { background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .6) 0 16%, transparent 18%), var(--p3); }
.steppers { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* 규칙 찾기: 한 줄에 꿴 구슬. 줄이 넘어가지 않게 칸이 화면에 맞춰 줄어든다. */
.seq { position: relative; display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 6px; width: 100%; max-width: 780px; container-type: inline-size; }
.seq::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--line); }
.cell { position: relative; flex: 0 1 68px; min-width: 0; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: clamp(.95rem, 6cqw, 2rem); line-height: 1; }
.cell svg { width: 88%; height: 88%; }
.cell.num { flex-basis: 84px; background: var(--tray); border: 3px solid var(--line); }
.cell.blank { border: 3px dashed var(--pop); background: var(--panel); color: var(--pop); }
.cell.num + .cell.blank { flex-basis: 84px; }

/* 숫자 색칠: 칸을 다 칠하면 틈이 사라지면서 그림이 된다 */
.px { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; width: min(54vh, 100%, 470px); container-type: inline-size; touch-action: pinch-zoom; }
.pc { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 4px; background: var(--tray); color: var(--ink); font-size: calc(100cqw / var(--n) * .46); line-height: 1; cursor: pointer; }
.px.sum .pc { font-size: calc(100cqw / var(--n) * .33); }
.px.done { gap: 0; }
.px.done .pc { border-radius: 0; }
.sw.used { opacity: .28; }

/* 궁금궁금: 꼼지가 묻는 말풍선, 정답의 검은 그림자, 그림+낱말 보기 */
.riddle { display: flex; align-items: flex-start; gap: 10px; max-width: 560px; }
.riddle .host { width: 48px; height: 48px; }
.riddle .rq { margin: 0; padding: 14px 18px; border-radius: 6px 22px 22px 22px; background: var(--tray); font-size: 1.5rem; line-height: 1.35; text-align: left; text-wrap: balance; }
.shade { display: flex; align-items: center; justify-content: center; width: clamp(96px, 16vh, 140px); height: clamp(96px, 16vh, 140px); font-size: clamp(4rem, 13vh, 6.5rem); line-height: 1; transition: filter .5s, opacity .5s; }
.shade.q { border: 3px dashed var(--line); border-radius: 26px; color: var(--soft); font-size: clamp(2.6rem, 8vh, 3.6rem); }
.shade.blur { filter: brightness(0) blur(6px); opacity: .55; } /* 힌트: 흐릿한 그림자 */
.shade.lit { filter: none; opacity: 1; }
.rc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 6px; }
.re { font-size: 2.3rem; line-height: 1; }
.rw { font-size: 1.15rem; line-height: 1.1; }

/* 꽉꽉: 10칸 틀 */
.eq { margin: 0; font-size: 2.4rem; line-height: 1.1; letter-spacing: .03em; }
.eq b { color: var(--pop); font-weight: 400; }
.frames { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.tf {
  --bead: clamp(22px, min(5vh, 7.2vw), 40px);
  display: grid; grid-template-columns: repeat(5, var(--bead)); gap: 4px; padding: 7px;
  border: 3px solid var(--line); border-radius: 14px; background: var(--tray);
}
.tf i { display: block; width: var(--bead); height: var(--bead); border: 2px dashed var(--line); border-radius: 50%; }
.tf i.b1, .tf i.b2 { border: 0; background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .6) 0 16%, transparent 18%), var(--p0); }
.tf i.b2 { background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .6) 0 16%, transparent 18%), var(--p1); }

/* 영차영차: 수 피라미드 */
.pyr, .pyr > div { display: flex; justify-content: center; gap: 6px; }
.pyr { flex-direction: column; align-items: center; }
.brick { display: flex; align-items: center; justify-content: center; min-width: 76px; height: 62px; padding: 0 10px; border-radius: 14px; background: var(--t-yellow); color: var(--on-tile); font-size: 1.9rem; line-height: 1; }
.pyr > div:nth-child(2) .brick { background: var(--t-coral); }
.pyr > div:nth-child(3) .brick { background: var(--t-blue); }
.pyr > div:nth-child(4) .brick { background: var(--t-sage); }
.pyr .brick.ask { border: 3px dashed var(--pop); background: var(--panel); color: var(--pop); }

/* 칙칙폭폭: 덧셈 기차 */
.train { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 620px; container-type: inline-size; }
.car { position: relative; flex: 0 1 104px; min-width: 0; aspect-ratio: 1.15; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border-radius: 16px; background: var(--t-blue); color: var(--on-tile); font-size: clamp(1.2rem, 8cqw, 2.3rem); line-height: 1; }
.car::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -13px; height: 16px; background: radial-gradient(circle at 8px 8px, var(--ink) 7px, transparent 7.5px) left / 16px 16px no-repeat, radial-gradient(circle at 8px 8px, var(--ink) 7px, transparent 7.5px) right / 16px 16px no-repeat; }
.car.ask { border: 3px dashed var(--pop); background: var(--panel); color: var(--pop); }
.op { flex: 0 1 90px; min-width: 0; margin-bottom: 16px; padding-bottom: 6px; border-bottom: 6px solid var(--line); color: var(--pop); font-size: clamp(1rem, 6.5cqw, 1.7rem); line-height: 1; text-align: center; }

/* 기우뚱: 저울 */
.scale { width: min(100%, 480px); height: auto; }
.scale .beam { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.scale .base { fill: var(--ink); }
.scale .blk { fill: var(--t-yellow); stroke: var(--on-tile); stroke-width: 2; }
.scale .blk.r { fill: var(--t-blue); }
.scale .blk.ask { fill: var(--panel); stroke: var(--pop); stroke-dasharray: 5 4; }
.scale text { fill: var(--on-tile); font-size: 21px; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
.scale text.ask { fill: var(--pop); }

/* 폴짝폴짝: 수 배열표 */
.hund { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; width: min(100%, 580px); }
.hund .day { min-height: 0; aspect-ratio: 1; border-radius: 10px; font-size: clamp(.8rem, 3.2vw, 1.35rem); }
.hund.frag { width: min(100%, 52vh, 380px); gap: 6px; }
.hund.frag .day { font-size: clamp(1.1rem, 5vw, 1.6rem); }
.leg { display: flex; gap: 10px; }
.leg span { padding: 6px 16px; border: 2px solid var(--line); border-radius: 999px; background: var(--tray); font-size: 1.25rem; line-height: 1.1; }

/* 짤랑짤랑: 동전 */
.shop { display: flex; align-items: center; gap: 14px; }
.shop svg { width: 60px; height: 60px; }
.tag { padding: 8px 18px; border-radius: 14px; background: var(--t-yellow); color: var(--on-tile); font-size: 2rem; line-height: 1; }
.purse, .coins { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.purse { width: min(100%, 540px); min-height: 84px; padding: 10px; border: 3px dashed var(--line); border-radius: 18px; }
.coin { width: 58px; height: 58px; padding: 0; border: 4px solid rgba(0, 0, 0, .18); border-radius: 50%; background: var(--silver); color: var(--on-tile); font: inherit; font-size: 1.15rem; line-height: 1; cursor: pointer; }
.coin.c10 { width: 50px; height: 50px; background: var(--p4); font-size: 1.05rem; }
.coin.c100 { width: 64px; height: 64px; }
.coin.c500 { width: 72px; height: 72px; background: var(--accent); font-size: 1.25rem; }
.coin:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* 뾰로롱: 마방진. 줄 끝 동그라미가 그 줄의 합 */
.magic { display: grid; grid-template-columns: repeat(4, auto); align-items: center; justify-items: center; gap: 6px; }
.mc { display: flex; align-items: center; justify-content: center; width: 74px; height: 74px; border: 2px solid var(--line); border-radius: 14px; background: var(--tray); font-size: 2rem; line-height: 1; }
.mc.slot { padding: 0; border-style: dashed; background: var(--panel); color: var(--pop); font: inherit; font-size: 2rem; cursor: pointer; }
.mc.slot.user { border-style: solid; }
.mc.slot.sel { border: 4px solid var(--pop); }
.mc.slot:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.msum.ok { background: var(--p2); color: var(--on-fill); }
.msum.bad { background: var(--pop); color: var(--paper); }
.pad { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.ntile { width: 64px; height: 64px; padding: 0; border: 3px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); font: inherit; font-size: 2rem; line-height: 1; cursor: pointer; }
.ntile:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.msum { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 1.3rem; line-height: 1; }
.gi .wh { fill: var(--on-tile); }

/* 점 잇기 */
.dots { width: min(60vh, 100%, 560px); height: auto; touch-action: pinch-zoom; }
.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.opts .chip { min-height: 40px; padding: 0 13px; font-size: 1.05rem; }
.dots .ln { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dots .rub { stroke: var(--soft); stroke-width: 1.2; stroke-dasharray: 2 2; stroke-linecap: round; }
.dots .dot { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.dots .dot.next { fill: var(--accent); }
.dots .dot.on { fill: var(--ink); }
.dots .dot.nudge { fill: var(--pop); transform-box: fill-box; transform-origin: center; }
.dots text { fill: var(--ink); font-size: 6px; text-anchor: middle; dominant-baseline: central; font-family: var(--font); pointer-events: none; }
.dots .fill { stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }

/* 달력 머리: 이전 달, 달 이름(한글과 영어), 다음 달 */
.calhead { display: flex; align-items: center; justify-content: center; gap: 12px; }
.calname { min-width: 150px; text-align: center; line-height: 1.1; }
.calname b { display: block; font-weight: 400; font-size: 1.8rem; }
.calname small { display: block; margin-top: 2px; color: var(--soft); font-size: 1.05rem; letter-spacing: .04em; }
.ico.flip { transform: scaleX(-1); }
.chip:disabled { opacity: .3; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: min(540px, 100%); }
.dow { text-align: center; color: var(--soft); font-size: 1.15rem; }
.dow.sun { color: var(--p0); }
.dow.sat { color: var(--p1); }
.day {
  display: flex; align-items: center; justify-content: center;
  min-height: 50px; padding: 0; border: 2px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--ink); font: inherit; font-size: 1.4rem; line-height: 1;
}
button.day { cursor: pointer; }
.day.ref { border: 3px solid var(--pop); background: var(--tray); }
.day.hide { border-style: dashed; background: transparent; }
.day.ask { border: 3px dashed var(--pop); color: var(--pop); font-size: 1.7rem; }

.gi .dab { stroke: var(--paper); stroke-width: 3; }
.paint { width: min(46vh, 84vw, 430px); max-height: 52vh; height: auto; touch-action: manipulation; }
.paint polygon { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; vector-effect: non-scaling-stroke; cursor: pointer; }
.paint .blank { fill: var(--panel); }
.paint text { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font-family: var(--font); pointer-events: none; }
.swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.sw {
  width: 62px; height: 62px; padding: 0; border: 4px solid var(--panel); border-radius: 50%;
  box-shadow: 0 0 0 2px var(--line); color: var(--on-tile);
  font: inherit; font-size: 1.6rem; line-height: 1; cursor: pointer;
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 5px var(--ink); transform: scale(1.08); }
.sw.nudge { box-shadow: 0 0 0 5px var(--pop); }
.sw:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
.sw.k0 { background: var(--p0); } .sw.k1 { background: var(--p1); } .sw.k2 { background: var(--p2); } .sw.k3 { background: var(--p3); }
.sw.k4 { background: var(--p4); } .sw.k5 { background: var(--p5); } .sw.k6 { background: var(--p6); }
.day.yes { background: var(--p2); border-color: var(--p2); color: var(--on-fill); }
.day.no { opacity: .35; }
.day:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.clock .knob { stroke: var(--panel); stroke-width: 3; }
.clock .k0 { fill: var(--p0); }
.clock .k1 { fill: var(--p1); }
.clock { width: min(52vh, 84vw, 440px); height: auto; touch-action: pinch-zoom; cursor: grab; }
.clock .face { fill: var(--tray); stroke: var(--ink); stroke-width: 5; }
.clock text { font-size: 26px; }
.clock .tick { stroke: var(--soft); stroke-width: 2; }
.clock .hh { stroke: var(--p0); stroke-width: 11; stroke-linecap: round; }
.clock .mh { stroke: var(--p1); stroke-width: 7; stroke-linecap: round; }
.clock .pin { fill: var(--ink); }

/* 글자 대신 쓰는 그림 단추 */
.chip svg.ico { width: 28px; height: 28px; }
.ico { fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.chip svg.ico { fill: none; }
.win-card .chip svg.ico { width: 40px; height: 40px; }
.tile {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border: 0; border-radius: 22px;
  background: var(--t-yellow); color: var(--on-tile);

}
.tile.blue { background: var(--t-blue); }
.tile.coral { background: var(--t-coral); }
.tile.sage { background: var(--t-sage); }
.tile .gi { flex: none; width: 68px; height: 68px; }
.tile .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile b { font-weight: 400; font-size: 1.45rem; }
.tile small { font-size: 1.05rem; opacity: .78; }
.tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.gi { width: 84px; height: 84px; }
.gi .ln { fill: none; stroke: var(--on-tile); stroke-width: 4; stroke-linecap: round; }
.gi .ln.h0 { stroke: var(--p0); }
.gi .ln.h1 { stroke: var(--p1); }
.gi .box { fill: var(--paper); stroke: var(--on-tile); stroke-width: 3; }
.gi .emo { font-size: 40px; text-anchor: middle; dominant-baseline: central; }
.gi .qm { fill: var(--on-tile); font-size: 26px; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
.dow.ref { border-radius: 10px; background: var(--accent); color: var(--on-accent); }

/* 꼼지의 한마디: 맞히면 웃는 얼굴로 짧게, 틀리면 아쉬운 얼굴로 왜 그런지 알려 준다 */
.fb {
  position: fixed; left: 50%; top: max(13%, 76px); z-index: 30; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(92vw, 540px);
  padding: 10px 22px 10px 12px; border: 3px solid transparent; border-radius: 26px;
  box-shadow: 0 8px 24px var(--shadow); line-height: 1.2; pointer-events: none;
}

.fb small { display: block; margin-top: 3px; font-size: 1.1rem; }
.fb.good { top: 50%; padding: 14px 30px 14px 16px; background: var(--p2); color: var(--on-fill); animation: fb-good .95s ease-out both; }
/* 안내 말풍선은 작게, 조금 아래에, 잠깐만 */
.fb.tip { top: max(25%, 168px); gap: 8px; padding: 6px 16px 6px 8px; border-radius: 20px; background: var(--accent); color: var(--on-accent); animation: fb-tip 2s ease-out both; }
.fb.tip .host { width: 36px; height: 36px; }
.fb.tip b { font-size: 1.2rem; }
.fb.tip small { margin-top: 1px; font-size: .9rem; }
@keyframes fb-tip {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  6%, 92% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%); }
}
.note { fill: var(--soft); font-size: 15px; text-anchor: middle; dominant-baseline: central; font-family: var(--font); pointer-events: none; }
.fb.bad { border-color: var(--pop); background: var(--panel); color: var(--ink); animation: fb-bad 3.4s ease-out both; }
.host .cheek { fill: var(--p0); }
.host .tear { fill: var(--p1); }
@keyframes fb-good {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  32%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
}
@keyframes fb-bad {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  5% { opacity: 1; transform: translate(calc(-50% - 7px), -50%) scale(1); }
  9% { transform: translate(calc(-50% + 7px), -50%); }
  13%, 92% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; transform: translate(-50%, -50%); }
}
@media (prefers-reduced-motion: reduce) { .fb.good, .fb.bad, .fb.tip { animation: none; } }

@keyframes nudge { 50% { transform: scale(1.12); } }
.nudge { border-color: var(--pop); animation: nudge .8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .nudge { animation: none; border-width: 5px; } }

@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.shake { animation: shake .3s; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

    const P = PUZZLES[i].pieces;
    box = bounds(P.flatMap(q => q.p));
    unit = Math.sqrt(P.reduce((a, q) => a + area(q.p), 0) / (P.length / 7)) / 4;
    slots = P.map(q => {
      const c = cen(q.p);
      return { t: q.t, p: q.p, c, rel: q.p.map(v => [v[0] - c[0], v[1] - c[1]]), filled: false, el: mk('polygon', { class: 'slot' }, slotLayer) };
    });
    pieces = slots.map((sl, k) => {
      const g = mk('g', { class: 'piece' }, looseLayer);
      const r = turning ? 90 * (1 + Math.floor(Math.random() * 3)) : 0;
      const p = { k, t: sl.t, rel: sl.rel, r, rot: r, x: 0, y: 0, z: 1, placed: false, slot: -1, g, poly: mk('polygon', { class: 'c' + (k % 7) }, g), anim: 0 };
      g.addEventListener('pointerdown', e => down(e, p));
      return p;
    });
    [...$('picker').children].forEach(b => {
      b.setAttribute('aria-pressed', String(+b.dataset.i === i));
      if (+b.dataset.i === i) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    $('hint').textContent = [
      '조각을 끌어서 그림에 맞춰 봐.',
      '조각을 톡 누르면 돌아가. 돌려서 그림에 맞춰 봐.',
      '어디에 놓을지 스스로 찾아봐. 톡 누르면 돌아가.',
    ][level];
    layout();
  }

  // 조각 놓는 곳에 겹치지 않게 줄 맞춰 놓기. 안 들어가면 null.
  // 두 조각이 gap보다 가까우면(겹치는 것 포함) 참
  function tooClose(A, B, gap) {
    for (const poly of [A, B]) {
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i], b = poly[(i + 1) % poly.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
        const nx = (b[1] - a[1]) / len, ny = (a[0] - b[0]) / len;
        let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
        for (const v of A) { const d = v[0] * nx + v[1] * ny; if (d < a0) a0 = d; if (d > a1) a1 = d; }
        for (const v of B) { const d = v[0] * nx + v[1] * ny; if (d < b0) b0 = d; if (d > b1) b1 = d; }
        if (a1 <= b0 - gap || b1 <= a0 - gap) return false; // 이 방향으로는 충분히 떨어져 있다
      }
    }
    return true;
  }
  // 조각 놓는 곳에 겹치지 않게 놓는다. 네모 칸이 아니라 조각의 실제 모양으로 따져서,
  // 세모 옆 빈 귀퉁이에 다른 조각이 들어간다. 큰 조각부터 왼쪽 위에서 빈자리를 찾는다. 안 들어가면 null.
  function pack(loose, sc) {
    const pad = 8, gap = 7, top = 24, step = 7;
    const X0 = tray.x + pad, Y0 = tray.y + pad + top, X1 = tray.x + tray.w - pad, Y1 = tray.y + tray.h - pad;
    const items = loose.map(p => {
      const pts = turned(p.rel, p.r).map(v => [v[0] * sc, v[1] * sc]);
      return { p, pts, b: bounds(pts) };
    }).sort((a, b) => b.b.w * b.b.h - a.b.w * a.b.h);
    const placed = [];
    for (const it of items) {
      const b = it.b;
      let spot = null;
      for (let y = Y0 - b.y0; y + b.y0 + b.h <= Y1 && !spot; y += step) {
        for (let x = X0 - b.x0; x + b.x0 + b.w <= X1; x += step) {
          const l = x + b.x0 - gap, r = x + b.x0 + b.w + gap, t = y + b.y0 - gap, u = y + b.y0 + b.h + gap;
          let poly = null, hit = false;
          for (const q of placed) {
            if (l >= q.r || q.l >= r || t >= q.u || q.t >= u) continue; // 멀리 있는 조각은 따질 필요가 없다
            if (!poly) poly = it.pts.map(v => [v[0] + x, v[1] + y]);
            if (tooClose(poly, q.poly, gap)) { hit = true; break; }
          }
          if (!hit) { spot = { p: it.p, x, y, l: l + gap, r: r - gap, t: t + gap, u: u - gap, poly: poly || it.pts.map(v => [v[0] + x, v[1] + y]) }; break; }
        }
      }
      if (!spot) return null;
      placed.push(spot);
    }
    // 왼쪽 위로 몰린 것을 놓는 곳 가운데로 옮긴다
    const dx = (X1 - Math.max(...placed.map(q => q.r)) - (Math.min(...placed.map(q => q.l)) - X0)) / 2;
    const dy = (Y1 - Math.max(...placed.map(q => q.u)) - (Math.min(...placed.map(q => q.t)) - Y0)) / 2;
    return placed.map(q => ({ p: q.p, x: q.x + dx, y: q.y + dy }));
  }

  let board = null, tray = null, trayZ = 1;
  const restZ = p => (tray && p.x >= tray.x && p.x <= tray.x + tray.w && p.y >= tray.y && p.y <= tray.y + tray.h ? trayZ : 1);
  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    if (!W || !H || !box) return;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const wide = W > H, gap = 12, loose = pieces.filter(p => !p.placed);
    // 조각은 그림의 자리와 늘 같은 크기이고, 놓는 곳에서 서로 겹치지 않는다.
    // 판과 조각 놓는 곳을 여러 비율로 나눠 보고, 그림이 가장 크게 나오는 비율을 고른다.
    const split = share => {
      board = wide ? { x: 0, y: 0, w: Math.round(W * share), h: H } : { x: 0, y: 0, w: W, h: Math.round(H * share) };
      tray = wide ? { x: board.w + gap, y: 0, w: W - board.w - gap, h: H } : { x: 0, y: board.h + gap, w: W, h: H - board.h - gap };
      const pad = Math.min(board.w, board.h) * 0.04 + 6;
      const full = Math.min((board.w - pad * 2) / box.w, (board.h - pad * 2) / box.h);
      let found = pack(loose, full), sc = full;
      if (!found) { // 판에 꽉 차는 크기로는 조각이 다 안 들어가면, 들어가는 가장 큰 크기를 찾는다
        let lo = full * 0.25, hi = full;
        for (let n = 0; n < 7; n++) { const mid = (lo + hi) / 2, f = pack(loose, mid); if (f) { lo = mid; found = f; sc = mid; } else hi = mid; }
        if (!found) { found = pack(loose, lo); sc = lo; }
      }
      return { share, sc: found ? sc : 0, found };
    };
    let best = null;
    for (let share = 0.74; share >= 0.38; share -= 0.04) { const t = split(share); if (!best || t.sc > best.sc + 0.01) best = t; }
    const chosen = split(best.share), spots = chosen.found; // 고른 비율로 판과 놓는 곳을 다시 잡는다
    for (const [el, r, inset] of [[boardRect, board, 0], [trayRect, tray, 1.5]]) {
      el.setAttribute('x', r.x + inset); el.setAttribute('y', r.y + inset);
      el.setAttribute('width', Math.max(0, r.w - inset * 2)); el.setAttribute('height', Math.max(0, r.h - inset * 2));
    }
    trayNote.textContent = turning ? '조각을 톡 누르면 돌아가!' : '조각을 끌어서 옮겨 봐!';
    trayNote.setAttribute('x', tray.x + tray.w / 2);
    trayNote.setAttribute('y', tray.y + 20);
    s = chosen.sc || 1; trayZ = 1;
    ox = board.x + (board.w - box.w * s) / 2 - box.x0 * s;
    oy = board.y + (board.h - box.h * s) / 2 - box.y0 * s;
    slots.forEach(sl => sl.el.setAttribute('points', sl.p.map(v => (ox + v[0] * s) + ',' + (oy + v[1] * s)).join(' ')));
    pieces.forEach(p => {
      p.poly.setAttribute('points', p.rel.map(v => (v[0] * s) + ',' + (v[1] * s)).join(' '));
      if (p.placed) { const c = slots[p.slot].c; p.x = ox + c[0] * s; p.y = oy + c[1] * s; }
    });
    pieces.forEach(p => { if (p.placed) p.z = 1; });
    if (spots) spots.forEach(o => { o.p.x = o.x; o.p.y = o.y; o.p.z = 1; });
    pieces.forEach(draw);
  }

  // ---------- 끌기 ----------
  const pos = e => {
    const r = svg.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  };
  function down(e, p) {
    if (p.placed || won || active.has(e.pointerId)) return;
    e.preventDefault(); wake();
    if (p.anim) { cancelAnimationFrame(p.anim); p.anim = 0; }
    const pt = pos(e);
    p.drag = { dx: pt.x - p.x, dy: pt.y - p.y, sx: pt.x, sy: pt.y, moved: false };
    active.set(e.pointerId, p);
    looseLayer.appendChild(p.g);
    p.g.classList.add('drag');
    tween(p, { z: 1 }, 110); // 집으면 제 크기로 커진다
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 잡지 못해도 놀이는 된다 */ }
  }
  svg.addEventListener('pointermove', e => {
    const p = active.get(e.pointerId);
    if (!p) return;
    const pt = pos(e), d = p.drag;
    if (Math.hypot(pt.x - d.sx, pt.y - d.sy) > 8) d.moved = true;
    p.x = Math.max(0, Math.min(W, pt.x - d.dx));
    p.y = Math.max(0, Math.min(H, pt.y - d.dy));
    draw(p);
  });
  const up = e => {
    const p = active.get(e.pointerId);
    if (!p) return;
    active.delete(e.pointerId);
    p.g.classList.remove('drag');
    if (!p.drag.moved && turning) {
      p.r += 90;
      tween(p, { rot: p.r, z: restZ(p) }, 160, () => { p.r %= 360; p.rot = p.r; draw(p); snap(p); });
    } else {
      snap(p);
      if (!p.placed) tween(p, { z: restZ(p) }, 120); // 놓는 곳에 내려놓으면 다시 작아진다
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);

  function snap(p) {
    if (p.placed) return;
    const rp = turned(p.rel, p.r), tol = unit * s * [0.9, 0.6, 0.45][level], eps = unit * 0.12;
    let best = -1, bestD = Infinity, near = false; // near: 맞는 모양의 빈자리 가까이에 놓았는지
    slots.forEach((sl, j) => {
      if (sl.filled || sl.t !== p.t) return;
      const d = Math.hypot(p.x - (ox + sl.c[0] * s), p.y - (oy + sl.c[1] * s));
      if (d > tol) return;
      near = true;
      if (d >= bestD) return;
      if (rp.every(v => sl.rel.some(w => Math.hypot(v[0] - w[0], v[1] - w[1]) < eps))) { best = j; bestD = d; }
    });
    if (best < 0) {
      // 자리는 맞게 찾았는데 방향이 다를 때만 알려 준다
      if (near) {
        const why = turning ? '방향이 달라. 톡 눌러서 돌려 봐.' : '자리는 맞는데 방향이 달라. 다른 조각일지도 몰라.';
        feedback(false, '거의 다 왔어!', why);
        say('거의 다 왔어! ' + why);
      }
      return;
    }
    const sl = slots[best];
    sl.filled = true; p.placed = true; p.slot = best;
    // 같은 모양 조각이 서로의 자리에 들어가도 되도록, 자리의 모양으로 바꿔 끼운다
    p.rel = sl.rel; p.r = 0; p.rot = 0;
    p.poly.setAttribute('points', p.rel.map(v => (v[0] * s) + ',' + (v[1] * s)).join(' '));
    placedLayer.appendChild(p.g);
    p.g.classList.add('placed');
    tween(p, { x: ox + sl.c[0] * s, y: oy + sl.c[1] * s, z: 1 }, 120);
    pop(); // 조각 하나는 띠링 소리만. 칭찬은 그림을 다 맞췄을 때 한다.
    if (pieces.every(q => q.placed)) {
      feedback(true, pick(PRAISE), ''); // 그림 하나를 다 맞추면 꼼지가 먼저 칭찬한다
      won = true;
      setTimeout(() => {
        if (!won) return;
        $('win').hidden = false; fanfare(); confetti($('fx'), () => won);
        say('우와, 다 맞췄어! 다음 그림도 해 볼까?');
      }, 950);
    }
  }

  // ---------- 다 맞췄을 때 ----------
  function confetti(c, alive) {
    if (reduce) return;
    const ctx = c.getContext('2d'), W = c.clientWidth, H = c.clientHeight;
    c.width = W; c.height = H;
    const css = getComputedStyle(document.documentElement);
    const cols = [0, 1, 2, 3, 4, 5, 6].map(k => css.getPropertyValue('--p' + k).trim());
    const parts = Array.from({ length: 80 }, (_, i) => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.5,
      vx: (Math.random() - 0.5) * 2, vy: 2.5 + Math.random() * 3,
      a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3,
      z: 8 + Math.random() * 10, c: cols[i % 7],
    }));
    const t0 = performance.now();
    const frame = now => {
      ctx.clearRect(0, 0, c.width, c.height);
      if (!alive() || now - t0 > 3500) return;
      for (const q of parts) {
        q.x += q.vx; q.y += q.vy; q.a += q.va;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a);
        ctx.fillStyle = q.c; ctx.beginPath();
        ctx.moveTo(-q.z, q.z / 2); ctx.lineTo(q.z, q.z / 2); ctx.lineTo(0, -q.z / 2);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // ---------- 버튼 ----------
  const inSet = i => PUZZLES[i].pieces.length === sets * 7;
  const mine = () => PUZZLES.map((z, i) => i).filter(inSet);
  function buildPicker() {
    $('picker').replaceChildren();
    mine().forEach(i => {
      const pz = PUZZLES[i], b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.id = 'pick-' + i; b.dataset.i = i;
      const bb = bounds(pz.pieces.flatMap(q => q.p)), side = Math.max(bb.w, bb.h);
      const icon = mk('svg', { viewBox: `${bb.cx - side / 2} ${bb.cy - side / 2} ${side} ${side}`, 'aria-hidden': 'true' }, b);
      pz.pieces.forEach(q => mk('polygon', { points: q.p.map(v => v.join(',')).join(' ') }, icon));
      b.appendChild(document.createTextNode(pz.name));
      b.addEventListener('click', () => { wake(); load(i); });
      $('picker').appendChild(b);
    });
  }
  const mark = () => {
    [1, 2].forEach(n => $('sets-' + n).setAttribute('aria-pressed', String(n === sets)));
    [0, 1, 2].forEach(n => $('level-' + n).setAttribute('aria-pressed', String(n === level)));
  };
  [1, 2].forEach(n => $('sets-' + n).addEventListener('click', () => {
    if (sets === n) return;
    sets = n; save(); mark(); buildPicker(); load(mine()[0]);
  }));
  [0, 1, 2].forEach(n => $('level-' + n).addEventListener('click', () => {
    level = n; save(); mark(); load(cur);
    turnTip();
  }));
  $('hint-btn').addEventListener('click', () => {
    slotLayer.classList.remove('plain');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => slotLayer.classList.toggle('plain', level === 2), 3000);
  });
  $('sound-home').addEventListener('click', () => {
    sound = !sound;
    $('sound-home').setAttribute('aria-pressed', String(sound));
    if (sound) { wake(); say('소리를 켰어'); }
    else if (canTalk) speechSynthesis.cancel();
  });
  $('listen-t').addEventListener('click', () => { wake(); say($('hint').textContent); });
  const applyVoice = () => {
    $('voice-home').setAttribute('aria-pressed', String(voice));
    $('listen-t').hidden = !voice;
    $('listen-q').hidden = !voice;
  };
  $('voice-home').addEventListener('click', () => {
    voice = !voice; save(); applyVoice();
    if (voice) { wake(); say('안녕! 나는 꼼지야.'); }
    else if (canTalk) speechSynthesis.cancel();
  });
  applyVoice();
  $('reset').addEventListener('click', () => load(cur));
  $('again').addEventListener('click', () => load(cur));
  $('next').addEventListener('click', () => {
    const ids = mine();
    load(ids[(ids.indexOf(cur) + 1) % ids.length]);
  });

  // ================= 문제 놀이 (한 판에 다섯 문제) =================
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  };
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const buzz = () => tone(180, 0, 0.18);
  const STAR = Array.from({ length: 10 }, (_, i) => {
    const r = i % 2 ? 7.5 : 18, a = Math.PI * i / 5 - Math.PI / 2;
    return (20 + r * Math.cos(a)).toFixed(1) + ',' + (20 + r * Math.sin(a)).toFixed(1);
  }).join(' ');
  function shape(kind, k) {
    const s = mk('svg', { viewBox: '0 0 40 40', 'aria-hidden': 'true' }), cls = 'c' + k;
    if (kind === 'circle') mk('circle', { cx: 20, cy: 20, r: 16, class: cls }, s);
    else if (kind === 'square') mk('rect', { x: 5, y: 5, width: 30, height: 30, rx: 4, class: cls }, s);
    else mk('polygon', { points: { triangle: '20,4 37,35 3,35', diamond: '20,2 36,20 20,38 4,20', star: STAR }[kind], class: cls }, s);
    return s;
  }
  // 정답 하나에 헷갈리는 수를 섞어 보기 네 개를 만든다
  function options(ans, cands) {
    const set = [ans];
    for (const c of shuffle(cands.slice())) if (set.length < 4 && c >= 0 && !set.includes(c)) set.push(c);
    for (let d = 1; set.length < 4; d++) {
      if (!set.includes(ans + d)) set.push(ans + d);
      else if (ans - d >= 0 && !set.includes(ans - d)) set.push(ans - d);
    }
    return shuffle(set).map(v => ({ value: v, text: String(v) }));
  }

  // 숫자 색칠 그림. 글자 하나가 색 하나이고, 점(.)은 바탕색(bg)이다.
  const INKS = { r: '--p0', b: '--p1', g: '--p2', y: '--p3', o: '--p4', v: '--p5', t: '--p6', k: '--on-tile' };
  const PICS_SMALL = [
    { name: '하트', bg: 'b', rows: ['........', '.rr..rr.', 'rvrrrrrr', 'rvrrrrrr', 'rrrrrrrr', '.rrrrrr.', '..rrrr..', '...rr...'] },
    { name: '꼼지', bg: 'b', rows: ['.yyyyyy.', 'yyyyyyyy', 'yykyykyy', 'yyyyyyyy', 'yryyyyry', 'yykyykyy', 'yyykkyyy', '.yyyyyy.'] },
    { name: '물고기', bg: 't', rows: ['........', '...ooo..', 'y.ooooo.', 'yyookooo', 'yyoooooo', 'y.ooooo.', '...ooo..', '........'] },
    { name: '집', bg: 'b', rows: ['...rr...', '..rrrr..', '.rrrrrr.', 'rrrrrrrr', '.yyyyyy.', '.yvvyky.', '.yvvyky.', '.yyyyky.'] },
  ];
  const PICS_BIG = [
    { name: '사과나무', bg: 'b', rows: ['....gg....', '...gggg...', '..grgggg..', '.gggggrgg.', '..gggggg..', '.grggggrg.', 'gggggggggg', '....oo....', '....oo....', 'yyyyooyyyy'] },
    { name: '로켓', bg: 'b', rows: ['....rr....', '...rrrr...', '...vvvv...', '...vttv...', '...vttv...', '...vvvv...', '..rvvvvr..', '.rrvvvvrr.', '.r..yy..r.', '....yy....'] },
    { name: '오리', bg: 'b', rows: ['..........', '....yyy...', '...yykyoo.', '...yyyy...', '.y..yy....', '.yyyyyyy..', '.yyyyyyy..', '..yyyyy...', 'tttttttttt', 'tttttttttt'] },
    { name: '꽃', bg: 'b', rows: ['...rrrr...', '..rrrrrr..', '.rrryyrrr.', '.rryyyyrr.', '.rrryyrrr.', '..rrrrrr..', '...rrrr...', '....g.....', '.gg.g.gg..', '..ggggg...'] },
    { name: '돛단배', bg: 'b', rows: ['....k.....', '....kr....', '...ykrr...', '..yykrrr..', '.yyykrrrr.', '....k.....', 'oooooooooo', '.oooooooo.', 'tttttttttt', 'tttttttttt'] },
  ];

  // 점 잇기 그림. 0~100 좌표에 점을 차례로 적는다. 마지막 점은 첫 점으로 이어진다.
  const DOTS = [

  const KNOW_TIPS = ['문제를 잘 듣고 생각해 봐. 모르겠으면 힌트를 눌러 봐.', '문제 속 힌트를 하나씩 모두 생각해 봐.', '어려운 낱말은 읽어 줘 단추로 들어 봐.'];

  function knowGame(t) {
    return {
      title: t.name,
      tips: KNOW_TIPS,
      bag: {},
      next(lv, box) {
        if (!this.bag[lv] || !this.bag[lv].length) this.bag[lv] = shuffle(t.items.filter(r => r.l === lv)); // 한 바퀴 다 낼 때까지 같은 문제가 안 나온다
        const r = this.bag[lv].pop();
        const bub = el('div', 'riddle');
        bub.append(face('kkom'), el('p', 'qtext rq', r.q)); // 문제 글은 말풍선 안에만 한 번 적는다
        const shade = el('div', 'shade q', '?');
        const tools = el('div', 'group'), read = el('button', 'chip'), hint = el('button', 'chip');
        read.type = 'button'; read.id = 'rd-read';
        read.append(ico('sound'), el('span', '', '읽어 줘'));
        read.addEventListener('click', () => { wake(); say(r.q, false, true); }); // 말해 주기를 꺼 둬도 이 단추는 읽어 준다
        hint.type = 'button'; hint.id = 'rd-hint';
        hint.textContent = '힌트';
        const showHint = () => { if (shade.classList.contains('lit')) return; shade.textContent = r.a[0]; shade.className = 'shade blur'; hint.disabled = true; };
        hint.addEventListener('click', () => { wake(); showHint(); });
        tools.append(read, hint);
        box.append(bub, shade, tools);
        return {
          answer: r.a[1],
          choices: shuffle([r.a[1], ...r.x]).map(w => ({ value: w, text: w })),
          why: () => { const first = !hint.disabled; showHint(); return first ? '힌트로 그림자를 보여 줄게.' : '흐릿한 그림자 모양을 잘 봐.'; },
          reveal: () => { shade.textContent = r.a[0]; shade.className = 'shade lit'; },
          praise: r.f,
          hold: 3000,
          say: r.q,
        };
      },
    };
  }

  const GAMES = {
    dots: {

      // 도움말은 고른 뛰어 세기에 따라 달라진다

        const t = dotStep === 1 ? '1부터 차례대로 점을 이어 봐.' : `${dotStep}, ${dotStep * 2}, ${dotStep * 3}. ${dotStep}씩 뛰어 세면서 이어 봐.`;

      next(lv, box) {
        // 난이도는 점 개수(★ 7개까지, ★★ 8~10개, ★★★ 11개부터), 뛰어 세기는 위쪽 단추로 고른다
        const pool = DOTS.filter(d => (lv === 0 ? d.p.length <= 7 : lv === 1 ? d.p.length >= 8 && d.p.length <= 10 : d.p.length >= 11));

        done.style.display = 'none';
        const line = mk('polyline', { class: 'ln', points: '' }, s), rub = mk('line', { class: 'rub' }, s);
        const unit = (a, b) => { const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1; return [(a[0] - b[0]) / d, (a[1] - b[1]) / d]; };
        const dots = P.map((v, i) => {
          // 숫자는 양옆 선에서 가장 먼 쪽에 적는다 (선이나 옆 점과 겹치지 않게)

          let dir = [a[0] + b[0], a[1] + b[1]];
          if (Math.hypot(dir[0], dir[1]) < 0.2) dir = unit(v, c);
          const d = Math.hypot(dir[0], dir[1]);
          const t = mk('text', { x: v[0] + dir[0] / d * 8.5, y: v[1] + dir[1] / d * 8.5 }, s);

        });

            if (at > n) { // 다 이었으면 색이 채워진 그림으로 바뀐다

              dots.forEach(d => { d.o.style.display = 'none'; d.t.style.display = 'none'; });
              right();
            }
          } else if (tap && P.some((v, i) => i > at && far(i) < 6)) {
            miss(null, '그 점은 아직 차례가 아니야.');
            if (quiz.miss >= 2) dots[at].o.classList.add('nudge');

          hit(where(e), true);

        else { miss(null, explain()); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
      });
      row.appendChild(b);
    }
  }
  function right() {
    quiz.busy = true; pop();
    if (quiz.cur.reveal) quiz.cur.reveal();
    quiz.n++; progress();
    // 한 문제를 맞힐 때마다 꼼지가 칭찬한다 (조각 하나, 칸 하나처럼 문제 중간에는 소리만 난다).
    // praise: 무엇을 해냈는지 한마디, hold: 다 만든 그림을 볼 수 있게 더 기다리는 시간
    const word = pick(PRAISE), detail = quiz.cur.praise || '', hold = quiz.cur.hold || 0;
    say(detail ? word + ' ' + detail : word);
    feedback(true, word, detail, hold ? hold + 600 : 950);
    if (quiz.n >= quiz.goal) {
      quiz.won = true;
      setTimeout(() => {
        if (!quiz.won) return;
        $('qwin').hidden = false; fanfare(); confetti($('qfx'), () => quiz.won);
        say('참 잘했어! 정말 멋지다. 한 번 더 할까?');
      }, 950 + hold);
    } else {
      setTimeout(() => { if (quiz.busy) ask(true); }, 1000 + hold);
    }
  }
  // 맞혔을 때 잠깐 뜨는 초록 칭찬 딱지
  let cheerTimer = 0;
  function cheer(word) { feedback(true, word, ''); }
  // 꼼지 얼굴: 맞히면 웃고, 틀리면 눈썹이 처지고 눈물이 한 방울 난다
  function mood(good) {
    const s = mk('svg', { viewBox: '0 0 44 44', class: 'host', 'aria-hidden': 'true' });
    mk('rect', { x: 4, y: 4, width: 36, height: 36, rx: 10, class: 'c3', transform: good ? 'rotate(-8 22 22)' : 'rotate(6 22 22)' }, s);
    if (good) {
      mk('path', { d: 'M11 20 Q14.5 15 18 20 M26 20 Q29.5 15 33 20 M15 26 Q22 34 29 26', class: 'feat' }, s);
      mk('circle', { cx: 10.5, cy: 27, r: 3, class: 'cheek' }, s);
      mk('circle', { cx: 33.5, cy: 27, r: 3, class: 'cheek' }, s);
    } else {
      mk('path', { d: 'M10 19 L17 15.5 M34 19 L27 15.5 M17 32 Q22 27.5 27 32', class: 'feat' }, s); // 눈썹 바깥쪽이 처진 아쉬운 얼굴
      mk('circle', { cx: 15, cy: 23, r: 2.2, class: 'eye' }, s);
      mk('circle', { cx: 29, cy: 23, r: 2.2, class: 'eye' }, s);
      mk('path', { d: 'M32 26 Q29.5 30.5 32 33 Q34.5 30.5 32 26 Z', class: 'tear' }, s);
    }
    return s;
  }
  // good이 참이면 칭찬(1초), 거짓이면 아쉬운 얼굴과 함께 이유를 보여 준다(3초 남짓)
  function feedback(good, title, detail, ms) {
    const c = $('cheer'), words = el('span');
    words.appendChild(el('b', '', title));
    if (detail) words.appendChild(el('small', '', detail));
    c.className = 'fb ' + (good === 'tip' ? 'tip' : good ? 'good' : 'bad'); // 'tip'은 노란 안내 말풍선
    c.replaceChildren(mood(good !== false), words);
    c.hidden = false;
    const life = ms || (good === true ? 950 : good === 'tip' ? 2000 : 3400); // 말풍선이 떠 있는 시간
    c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
    c.style.animationDuration = ms ? ms / 1000 + 's' : '';
    clearTimeout(cheerTimer);
    cheerTimer = setTimeout(() => { c.hidden = true; }, life);
  }
  // 조각을 돌려야 하는 난이도에서는 누르면 돌아간다고 먼저 알려 준다
  function turnTip() {
    if (!turning || $('view-tangram').hidden) return;
    feedback('tip', '조각을 톡 누르면 돌아가!', '방향이 다르면 톡톡 눌러서 맞춰 봐.');
  }
  // 틀렸을 때: 처음에는 다시 해 보라고 하고, 두 번째부터는 엄마처럼 살짝 알려 준다
  // why: 왜 틀렸는지 한마디. 그 뒤에 이 단계의 도움말을 붙여서 보여 주고 읽어 준다.
  function miss(btn, why) {
    if (btn) { btn.classList.add('no'); btn.disabled = true; }
    buzz(); quiz.miss++;
    const title = pick(RETRY), tip = GAMES[quiz.id].tips[quiz.level], detail = why ? why + ' ' + tip : tip;
    feedback(false, title, detail);
    say(title + ' ' + detail);
    if (quiz.miss < 2) return;
    const ok = $('view-quiz').querySelector('[data-ok]');
    if (ok) ok.classList.add('nudge'); // 두 번 틀리면 정답 쪽이 살짝 움직인다
  }
  function openQuiz(id) {
    quiz.id = id; quiz.n = 0; quiz.goal = GAMES[id].rounds || 5;
    quiz.level = [0, 1, 2].includes(ql[id]) ? ql[id] : 1;
    $('qtitle').textContent = GAMES[id].title;
    $('host-q').replaceChildren(face(HOST[id]));
    show('quiz', true); say(GAMES[id].title); ask(true);
  }
  $('listen-q').addEventListener('click', () => { wake(); say(quiz.line + ' ' + GAMES[quiz.id].tips[quiz.level]); });
  [0, 1, 2].forEach(n => $('ql-' + n).addEventListener('click', () => {
    quiz.level = n; ql[quiz.id] = n; save(); quiz.n = 0; ask();
  }));
  $('qagain').addEventListener('click', () => { quiz.n = 0; ask(); });

  // ================= 첫 화면 =================
  function show(v, quiet) {
    ['home', 'tangram', 'quiz'].forEach(n => { $('view-' + n).hidden = n !== v; });
    $('cheer').hidden = true; // 다른 화면으로 가면 떠 있던 말풍선을 치운다
    if (v !== 'quiz') { quiz.busy = false; quiz.won = false; }
    if (quiet) return;
    if (v === 'home') say('오늘은 뭐하고 놀까?');
    else if (v === 'tangram') { say('요리조리. ' + $('hint').textContent); turnTip(); }
  }
  // 꼼지: 살짝 기울어진 노란 네모, 윙크하는 얼굴, 파란 세모를 들고 있다
  function mascot() {
    const s = mk('svg', { viewBox: '0 0 120 120', class: 'mj', 'aria-hidden': 'true' });
    mk('path', { d: 'M50 86 Q47 102 37 105 M72 86 Q78 99 91 99 M30 64 Q17 62 12 51 M90 52 Q99 45 99 33', class: 'limb' }, s);
    mk('polygon', { points: '91,13 114,27 94,39', class: 'tri' }, s);
    mk('path', { d: 'M66 6 L68 15 M79 9 L75 17', class: 'spark' }, s);
    const g = mk('g', { transform: 'rotate(-12 59 55)' }, s);
    mk('rect', { x: 28, y: 24, width: 62, height: 62, rx: 15, class: 'body' }, g);
    mk('ellipse', { cx: 48, cy: 52, rx: 4, ry: 6, class: 'eye' }, g);
    mk('path', { d: 'M78 45 L69 50 L78 55 M55 63 Q62 71 70 62', class: 'feat' }, g);
    mk('circle', { cx: 42, cy: 65, r: 5.5, class: 'cheek' }, g);
    mk('circle', { cx: 80, cy: 62, r: 5.5, class: 'cheek' }, g);
    return s;
  }
  // 놀이를 맡은 친구 얼굴: kkom 꼼지, dong 동글, semo 세모
  function face(kind) {
    const s = mk('svg', { viewBox: '0 0 44 44', class: 'host', 'aria-hidden': 'true' }), y = kind === 'semo' ? 5 : 0;
    if (kind === 'dong') mk('circle', { cx: 22, cy: 22, r: 19, class: 'c1' }, s);
    else if (kind === 'semo') mk('polygon', { points: '22,7 38,36 6,36', class: 'c0 round' }, s);
    else mk('rect', { x: 4, y: 4, width: 36, height: 36, rx: 10, class: 'c3' }, s);
    mk('circle', { cx: 16, cy: 21 + y, r: 2.4, class: 'eye' }, s);
    mk('circle', { cx: 28, cy: 21 + y, r: 2.4, class: 'eye' }, s);
    mk('path', { d: `M18 ${27 + y} Q22 ${31 + y} 26 ${27 + y}`, class: 'feat' }, s);
    return s;
  }
  // 글자 대신 쓰는 단추 그림
  function ico(name) {
    const s = mk('svg', { viewBox: '0 0 40 40', class: 'ico', 'aria-hidden': 'true' });
    const d = {
      home: 'M5 20 L20 7 L35 20 M10 17 V33 H30 V17',
      sound: 'M6 16 H12 L21 9 V31 L12 24 H6 Z M27 14 Q32 20 27 26',
      retry: 'M31 20 A11 11 0 1 1 26 11 M27 3 V12 H18',
      next: 'M13 8 L32 20 L13 32 Z',
      check: 'M8 21 L17 30 L33 11',
      clock: 'M20 6 a14 14 0 1 0 0.01 0 Z M20 12 V20 H27',
      talk: 'M6 8 H34 V27 H21 L12 34 V27 H6 Z',
    }[name];
    mk('path', { d }, s);
    return s;
  }
  const SQUARE = PUZZLES.find(z => z.name === '네모').pieces;
  const pts = q => q.p.map(v => v.join(',')).join(' ');
  function gameIcon(id) {
    const s = mk('svg', { viewBox: '0 0 60 60', class: 'gi', 'aria-hidden': 'true' });
    if (id === 'bonds') {
      mk('path', { d: 'M30 16 L16 42 M30 16 L44 42', class: 'ln' }, s);
      [[30, 16, 10, 0], [16, 44, 9, 1], [44, 44, 9, 4]].forEach(([cx, cy, r, k]) => mk('circle', { cx, cy, r, class: 'c' + k }, s));
    } else if (id === 'bundles') {
      mk('rect', { x: 8, y: 6, width: 16, height: 48, rx: 6, class: 'box' }, s);
      [14, 25, 36, 47].forEach(cy => mk('circle', { cx: 16, cy, r: 4.5, class: 'c0' }, s));
      [[36, 46], [49, 46], [42, 34]].forEach(([cx, cy]) => mk('circle', { cx, cy, r: 5.5, class: 'c3' }, s));
    } else if (id === 'clock') {
      mk('circle', { cx: 30, cy: 30, r: 24, class: 'box' }, s);
      mk('path', { d: 'M30 30 V13', class: 'ln h1' }, s);
      mk('path', { d: 'M30 30 L41 36', class: 'ln h0' }, s);
    } else if (id === 'calendar') {
      mk('rect', { x: 7, y: 10, width: 46, height: 42, rx: 7, class: 'box' }, s);
      mk('rect', { x: 7, y: 10, width: 46, height: 13, rx: 6, class: 'c0' }, s);
      [20, 30, 40].forEach(cx => [33, 43].forEach(cy => mk('circle', { cx, cy, r: 3.2, class: cx === 30 && cy === 43 ? 'c0' : 'c1' }, s)));
    } else if (id === 'tangram') {
      const g = mk('g', { transform: 'translate(8 8) scale(11)' }, s);
      SQUARE.forEach((q, k) => mk('polygon', { points: pts(q), class: 'c' + k }, g));
    } else if (id.startsWith('k-')) {
      mk('text', { x: 30, y: 32, class: 'emo' }, s).textContent = KNOW[id.slice(2)].icon;
    } else if (id === 'make10') {
      mk('rect', { x: 5, y: 15, width: 50, height: 30, rx: 7, class: 'box' }, s);
      for (let i = 0; i < 10; i++) mk('circle', { cx: 12 + (i % 5) * 9, cy: i < 5 ? 24 : 36, r: 3.6, class: i < 7 ? 'c0' : 'c1' }, s);
    } else if (id === 'pyramid') {
      [[21, 9, 3], [11, 25, 0], [31, 25, 0], [1, 41, 1], [21, 41, 1], [41, 41, 1]].forEach(([x, y, k]) => mk('rect', { x, y, width: 18, height: 14, rx: 3, class: 'c' + k + ' dab' }, s));
    } else if (id === 'train') {
      mk('rect', { x: 5, y: 17, width: 30, height: 25, rx: 5, class: 'c1 dab' }, s);
      mk('rect', { x: 37, y: 26, width: 18, height: 16, rx: 4, class: 'c0 dab' }, s);
      [14, 27, 46].forEach(cx => mk('circle', { cx, cy: 46, r: 5, class: 'wh' }, s));
    } else if (id === 'scale') {
      mk('path', { d: 'M12 20 H48 M12 20 L5 38 M12 20 L19 38 M48 20 L41 38 M48 20 L55 38 M2 38 H22 M38 38 H58 M30 20 V50 M19 52 H41', class: 'ln' }, s);
    } else if (id === 'hundred') {
      for (let i = 0; i < 9; i++) mk('rect', { x: 7 + (i % 3) * 16, y: 7 + Math.floor(i / 3) * 16, width: 14, height: 14, rx: 3, class: i === 4 ? 'c3 dab' : 'box' }, s);
    } else if (id === 'coins') {
      mk('circle', { cx: 23, cy: 34, r: 16, class: 'c4 dab' }, s);
      mk('circle', { cx: 40, cy: 26, r: 14, class: 'c3 dab' }, s);
    } else if (id === 'magic') {
      for (let i = 0; i < 9; i++) mk('rect', { x: 7 + (i % 3) * 16, y: 7 + Math.floor(i / 3) * 16, width: 14, height: 14, rx: 3, class: i % 4 === 0 ? 'c' + [0, 3, 1][i / 4] + ' dab' : 'box' }, s);
    } else if (id === 'dots') {
      mk('path', { d: 'M12 44 L24 16 L40 34 L50 14', class: 'ln' }, s);
      [[12, 44, 0], [24, 16, 3], [40, 34, 1], [50, 14, 0]].forEach(([cx, cy, k]) => mk('circle', { cx, cy, r: 6, class: 'c' + k + ' dab' }, s));
    } else if (id === 'color') {
      [[21, 23, 3], [39, 23, 1], [30, 39, 2]].forEach(([cx, cy, k]) => mk('circle', { cx, cy, r: 13, class: 'c' + k + ' dab' }, s));
    } else {
      mk('circle', { cx: 11, cy: 30, r: 8, class: 'c1' }, s);
      mk('polygon', { points: '30,21 39,38 21,38', class: 'c3' }, s);
      mk('text', { x: 50, y: 31, class: 'qm' }, s).textContent = '?';
    }
    return s;
  }
  [['home-t', 'home', '홈'], ['home-q', 'home', '홈'], ['qhome', 'home', '다른 놀이'], ['reset', 'retry', '다시'],
    ['again', 'retry', '한 번 더'], ['qagain', 'retry', '한 번 더'], ['next', 'next', '다음 그림'],
    ['sound-home', 'sound', '소리'], ['voice-home', 'talk', '말해 주기'], ['listen-t', 'sound', '설명 듣기'], ['listen-q', 'sound', '문제 듣기']].forEach(([id, name, label]) => {
    $(id).replaceChildren(ico(name));
    $(id).setAttribute('aria-label', label);
  });
  $('hint-btn').textContent = '?';
  $('hint-btn').setAttribute('aria-label', '힌트');
  ['level-', 'ql-'].forEach(pre => [0, 1, 2].forEach(n => {
    $(pre + n).textContent = '★'.repeat(n + 1);
    $(pre + n).setAttribute('aria-label', '난이도 ' + ['쉬움', '보통', '어려움'][n]);
  }));
  [1, 2].forEach(n => {
    const s = mk('svg', { viewBox: '0 0 4 4', 'aria-hidden': 'true' });
    SQUARE.forEach(q => mk('polygon', { points: pts(q) }, s));
    $('sets-' + n).replaceChildren(s, document.createTextNode(`조각 ${n}세트`));
  });
  ['home-t', 'home-q', 'qhome'].forEach(id => $(id).addEventListener('click', () => show('home')));
  const TILES = [
    { id: 'tangram', name: '요리조리', sub: '칠교 놀이', tone: 'coral' },
    { id: 'clock', name: '째깍째깍', sub: '시계 놀이', tone: 'yellow' },
    { id: 'calendar', name: '오늘은 무슨 날?', sub: '달력 놀이', tone: 'blue' },
    { id: 'bonds', name: '모아모아', sub: '수 가르기와 모으기', tone: 'sage' },
    { id: 'bundles', name: '차곡차곡', sub: '열 개씩 묶어 세기', tone: 'blue' },
    { id: 'pattern', name: '알쏭달쏭', sub: '규칙 찾기', tone: 'yellow' },
    { id: 'color', name: '알록달록', sub: '숫자 색칠', tone: 'coral' },
    { id: 'dots', name: '콕콕', sub: '점 잇기', tone: 'sage' },
    { id: 'make10', name: '꽉꽉', sub: '10 만들어 더하기', tone: 'yellow' },
    { id: 'pyramid', name: '영차영차', sub: '수 피라미드', tone: 'blue' },
    { id: 'train', name: '칙칙폭폭', sub: '덧셈 기차', tone: 'coral' },
    { id: 'scale', name: '기우뚱', sub: '저울 맞추기', tone: 'sage' },
    { id: 'hundred', name: '폴짝폴짝', sub: '100까지 수 놀이', tone: 'yellow' },
    { id: 'coins', name: '짤랑짤랑', sub: '동전 계산', tone: 'blue' },
    { id: 'magic', name: '뾰로롱', sub: '마방진', tone: 'coral' },
    ...Object.entries(KNOW).map(([key, t], i) => ({ id: 'k-' + key, name: t.name, sub: t.sub, tone: ['blue', 'coral', 'sage', 'yellow'][i % 4], area: 'know' })),
  ];
  const go = id => { wake(); if (id === 'tangram') show('tangram'); else openQuiz(id); };
  // 첫 화면은 영역별로 나눈다: 사고력 수학, 세상 탐험
  [['math', '사고력 수학'], ['know', '세상 탐험 · 과학과 사회']].forEach(([area, title]) => {
    const sec = el('section', 'area'), grid = el('div', 'grid');
    sec.append(el('h2', '', title), grid);
    TILES.filter(t => (t.area || 'math') === area).forEach(t => {
      const b = el('button', 'tile ' + t.tone);
      b.type = 'button'; b.id = 'go-' + t.id;
      const words = el('span', 'tt');
      words.append(el('b', '', t.name), el('small', '', t.sub));
      b.append(gameIcon(t.id), words);
      b.addEventListener('click', () => go(t.id));
      grid.appendChild(b);
    });
    $('tiles').appendChild(sec);
  });
  // 잠깐 놀기: 꼼지가 놀이 하나를 골라 준다
  $('quick').append(ico('next'), el('b', '', '잠깐 놀기'));
  $('quick').setAttribute('aria-label', '잠깐 놀기: 꼼지가 놀이를 골라 줘요');
  $('quick').addEventListener('click', () => go(pick(TILES).id));
  $('mascot-home').replaceChildren(mascot());
  document.querySelectorAll('.win-mj').forEach(n => n.replaceChildren(mascot()));
  $('host-t').replaceChildren(face('semo'));

  // 휴대폰에서는 단계·칠교 개수 단추가 하나만 보인다. 그 단추를 누르면 다음 것으로 넘어간다.
  const narrow = matchMedia('(max-width: 640px), (max-height: 520px)');
  document.querySelectorAll('.cyc').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b || !narrow.matches || b.getAttribute('aria-pressed') !== 'true') return;
    e.stopPropagation();
    const all = [...g.querySelectorAll('.chip')];
    all[(all.indexOf(b) + 1) % all.length].click();
  }, true));

  new ResizeObserver(layout).observe(stage);
  mark(); buildPicker(); load(mine()[0]);
  show('home', true);
})();
</script>
